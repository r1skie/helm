name: release

# Tag a version to cut a signed release:  git tag v0.1.1 && git push origin v0.1.1
# tauri-action builds + signs the NSIS installer and generates latest.json (the updater manifest).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # pnpm 11 requires Node >= 22.13 (uses node:sqlite)

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          # Set these as repo secrets (Settings → Secrets and variables → Actions):
          #   TAURI_SIGNING_PRIVATE_KEY           = contents of src-tauri/.tauri-signing.key
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = "" (key was generated without a password)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HELM ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
          includeUpdaterJson: true
